name: Eval

# Manual only: boots the full stack (pgvector + app), runs the eval
# harness against the Gemini free-tier API, and uploads the results.
# Needs the GEMINI_API_KEY repo secret (free key at https://aistudio.google.com).
# Never runs on push (each run costs ~15 chat + embedding API calls).
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: docpilot
          POSTGRES_USER: docpilot
          POSTGRES_PASSWORD: docpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docpilot -d docpilot"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Gemini API key
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY secret is not set — add a free key at https://aistudio.google.com"
            exit 1
          fi

      - name: Build app
        run: mvn -B package -DskipTests

      - name: Start app and wait for seed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          nohup java -jar target/docpilot-*.jar > app.log 2>&1 &
          echo "waiting for seed..."
          for i in $(seq 1 120); do
            if grep -q "Seeded .* sample documents" app.log 2>/dev/null; then
              echo "seeded after ~$((i * 5))s"; break
            fi
            if ! kill -0 $! 2>/dev/null; then
              echo "app died during boot:"; tail -40 app.log; exit 1
            fi
            sleep 5
          done
          grep -q "Seeded .* sample documents" app.log || (echo "seed timed out:"; tail -40 app.log; exit 1)
          curl -sf http://localhost:8080/actuator/health

      - name: Run eval harness
        run: |
          cd eval
          python3 eval.py http://localhost:8080 | tee eval-results.txt

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/eval-results.txt
