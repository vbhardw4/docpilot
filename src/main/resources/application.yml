server:
  port: 8080

spring:
  application:
    name: docpilot
  datasource:
    url: jdbc:postgresql://localhost:5432/docpilot
    username: docpilot
    password: docpilot
  jpa:
    hibernate:
      # Demo setting. For production, switch to Flyway/Liquibase migrations.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    ollama:
      # Local LLM — no API key, no account, no cost. Requires `ollama serve`
      # running locally with the models pulled (see README).
      base-url: http://localhost:11434
      chat:
        model: llama3.2:3b
        options:
          temperature: 0.2
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        schema-name: public
        table-name: vector_store
        # Must match the embedding model (nomic-embed-text = 768 dims).
        # Changing the embedding model requires matching this and re-ingesting.
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

management:
  endpoints:
    web:
      exposure:
        include: health,info

# DocPilot tuning knobs — see config/DocPilotProperties.java
docpilot:
  retrieval:
    top-k: 5
    # Cosine similarity floor. Below this, the question is treated as
    # "not in the docs" and escalates to a support ticket instead of guessing.
    similarity-threshold: 0.72
  chat:
    # How many prior messages are included as conversation context.
    history-window: 8
